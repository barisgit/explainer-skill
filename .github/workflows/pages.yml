name: pages

# Publishes examples/ as it is committed: the packed pages are self-contained, so nothing is built here.
on:
  push:
    branches: [main]
    paths: [examples/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples
      - id: deployment
        uses: actions/deploy-pages@v5
