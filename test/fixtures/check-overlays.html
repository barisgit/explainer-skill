<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omitted overlays</title>
<style>
.fixed { position:fixed;right:0;top:0;width:80px;height:40px;background:red }
@media (max-width:600px) { #desktop-open { display:none } }
@media (min-width:601px) { #narrow-open { display:none } }
#transparent { opacity:0 }
#outside { right:auto;left:-1000px }
#concealed { visibility:hidden }
</style>
<div data-overview>
<h1>Overview</h1>
<a href="#detail">Detail</a>
<button id="open" onclick="document.querySelectorAll('.drawer').forEach(el => el.hidden = false)">Open panel</button>
<div id="desktop-open" class="fixed drawer" hidden>Desktop</div>
<div id="narrow-open" class="fixed drawer" hidden>Narrow</div>
</div>
<section class="view" data-view="detail" hidden>
<h1>Detail</h1>
<div id="view-fixed" class="fixed">View panel</div>
</section>
<div id="hidden" class="fixed" hidden>Hidden</div>
<div id="transparent" class="fixed">Transparent</div>
<div id="outside" class="fixed">Offscreen</div>
<div id="concealed" class="fixed">Concealed</div>
<script>
const detail = location.hash === '#detail';
document.documentElement.classList.toggle('in-view', detail);
document.querySelector('[data-overview]').hidden = detail;
document.querySelector('[data-view]').hidden = !detail;
</script>
</html>
