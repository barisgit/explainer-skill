:root {
	color-scheme: light dark;
	--font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	--mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	--bg: light-dark(#f7f4ee, #141210);
	--surface: light-dark(#fffdfa, #1c1a17);
	--sunken: light-dark(#efebe3, #252220);
	--ink: light-dark(#1c1915, #eee8de);
	--muted: light-dark(#665e53, #a59c8f);
	--rule: light-dark(#e5dfd4, #2e2a25);
	--rule-strong: light-dark(#b8ad99, #5a534a);
	--accent: light-dark(#b93a05, #ff8a3d);
	--accent-ink: light-dark(#fff, #1b1208);
	/* The soft tints derive from --accent and --warn, so a page that changes only --accent stays consistent. */
	--accent-soft: color-mix(in oklab, var(--accent) 13%, var(--surface));
	--ok: light-dark(#18744b, #5fcf99);
	--bad: light-dark(#b3322a, #f2776b);
	--warn: light-dark(#8a5a00, #e8b94a);
	--warn-soft: color-mix(in oklab, var(--warn) 11%, var(--surface));
	--info: light-dark(#35609c, #8fb2e8);
	/* Categorical series colours (Okabe-Ito derived); use in this order. */
	--c1: light-dark(#0072b2, #4aa3df);
	--c2: light-dark(#d55e00, #ef7d3b);
	--c3: light-dark(#009e73, #2fc095);
	--c4: light-dark(#cc79a7, #e08fc0);
	--c5: light-dark(#8a6d00, #e6b422);
	--c6: light-dark(#3394cc, #7cc6f0);
	--grid: color-mix(in srgb, var(--rule-strong) 45%, transparent);
	/* Blueprint surface for diagrams (.stage, a Mermaid block in a panel): a faint dot grid on the page tone. */
	--blueprint:
		radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 1.5px) 0 0 / 20px 20px,
		var(--bg);
	--lift: light-dark(rgb(40 28 10 / 0.12), rgb(0 0 0 / 0.45));
	--gutter: clamp(1rem, 4vw, 2rem);
	--inset: clamp(1rem, 2.5vw, 1.25rem);
	--radius: 0.625rem;
	/* The tone under the current block: --bg on the page and on the blueprint, --surface in a panel, --sunken in a band. Halos and split cells use it. */
	--under: var(--bg);
	--ease: cubic-bezier(0.25, 1, 0.5, 1);
}
:root[data-scheme="light"] {
	color-scheme: light;
}
:root[data-scheme="dark"] {
	color-scheme: dark;
}

*,
*::before,
*::after {
	box-sizing: border-box;
}
[hidden] {
	/* biome-ignore lint/complexity/noImportantStyles: [hidden] must hide an element whatever display its component rule sets */
	display: none !important;
}
html {
	-webkit-text-size-adjust: 100%;
}
body {
	margin: 0;
	background: var(--bg);
	color: var(--ink);
	font: 1rem / 1.6 var(--font);
	text-wrap: pretty;
	font-synthesis: none;
	-webkit-font-smoothing: antialiased;
}
::selection {
	background: color-mix(in oklab, var(--accent) 25%, transparent);
}
:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}
/* Headings that a router focuses after navigation (tabindex="-1") are not controls: no ring. */
[tabindex="-1"]:focus {
	outline: none;
}
button,
input,
select,
textarea {
	font: inherit;
	color: inherit;
}
img,
svg {
	max-inline-size: 100%;
}
code,
pre,
kbd {
	font-family: var(--mono);
	font-size: 0.875em;
}
code {
	background: var(--sunken);
	padding: 0.1em 0.35em;
	border-radius: 0.25rem;
}
pre {
	background: var(--sunken);
	padding: 0.75rem 1rem;
	border-radius: var(--radius);
	overflow-x: auto;
}
pre code {
	background: none;
	padding: 0;
}
a {
	color: var(--accent);
	text-decoration-thickness: 1px;
	text-underline-offset: 0.2em;
}
a:hover {
	text-decoration-thickness: 2px;
}
b,
strong {
	font-weight: 600;
}

/* theme part: page shell, headings, section rhythm (band, minor, beside), figures and panels, split columns. */
/* Page shell: masthead, then sections divided by hairlines. <p class="label"> is a plain caption over a group inside a section. */
.page {
	inline-size: min(100% - 2 * var(--gutter), 66rem);
	margin: 0 auto;
	padding-block: clamp(1.75rem, 5vw, 3.5rem) 6rem;
}
.page :where(p, ul, ol) {
	max-inline-size: 66ch;
}
.masthead {
	margin-block-end: clamp(2rem, 5vw, 3rem);
}
h1 {
	margin: 0 0 1.25rem;
	max-inline-size: 24ch;
	font-size: clamp(2rem, 5vw, 3.5rem);
	font-weight: 700;
	line-height: 1.04;
	letter-spacing: -0.035em;
	text-wrap: balance;
}
/* The accent phrase stays on one line from tablet width up: a break at "18-minute" splits the one highlighted fact. Keep it a few words;
   on a phone it wraps like the rest of the headline, since a long phrase would run off the screen. */
h1 em {
	font-style: normal;
	color: var(--accent);
}
@media (min-width: 40rem) {
	h1 em {
		white-space: nowrap;
	}
}
h2 {
	margin: 0 0 1.25rem;
	max-inline-size: 32ch;
	font-size: clamp(1.5rem, 3.2vw, 2rem);
	font-weight: 650;
	line-height: 1.15;
	letter-spacing: -0.025em;
	text-wrap: balance;
}
h2 em {
	font-style: normal;
	color: var(--accent);
}
/* A minor section's heading is set as an h3: it labels reference, not a finding. */
h3,
.minor > h2 {
	margin: 0;
	font-size: 1.0625rem;
	font-weight: 600;
	line-height: 1.35;
	letter-spacing: -0.01em;
	text-wrap: balance;
}
.lede {
	max-inline-size: 60ch;
	margin: 0 0 1rem;
	font-size: clamp(1.0625rem, 1.6vw, 1.1875rem);
	line-height: 1.5;
	color: var(--muted);
}
.lede b {
	color: var(--ink);
	font-weight: 600;
}
.meta {
	margin: 0;
	font: 0.8125rem / 1.6 var(--mono);
	color: var(--muted);
	font-variant-numeric: tabular-nums;
}
.label {
	margin: 0 0 0.375rem;
	font-size: 0.9375rem;
	font-weight: 500;
	color: var(--muted);
}
.page section:not(.view) {
	margin-block: clamp(3.5rem, 9vw, 6rem);
	padding-block-start: clamp(1.5rem, 3vw, 2rem);
	border-block-start: 1px solid var(--rule);
}
.cols {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
	gap: 1rem 1.5rem;
}
/* Wider than the reading column on big screens, for tables and side-by-side panels; full column width on phones. Expand all just
   above a .wide block (kit:views.js) takes its margins, so it ends where the block does; the navigation part keeps its start. */
.wide,
.fold-all:has(+ .wide) {
	margin-inline: calc(50% - min(44rem, 50vw - var(--gutter)));
}
/* Band: the one stretch where the reader acts or decides, in the sunken tone from window edge to edge. The content keeps the column;
   the shadow carries the tone sideways and the clip keeps it to the band's height, so nothing scrolls sideways. */
.band {
	--under: var(--sunken);
	background: var(--under);
	box-shadow: 0 0 0 100vmax var(--under);
	clip-path: inset(0 -100vmax);
}
.page section.band,
.page .band + section {
	border-block-start: 0;
}
.page section.band {
	padding-block: clamp(2rem, 5vw, 3.5rem);
}
/* Minor section (method, sources, assumptions): smaller type and, on wide screens, the heading in its own column, so it reads as
   reference rather than as another finding. */
.page section.minor {
	margin-block: clamp(2rem, 5vw, 3rem);
	font-size: 0.9375rem;
}
.minor > h2 {
	margin-block-end: 0.75rem;
}
@media (min-width: 56rem) {
	.minor {
		display: grid;
		grid-template-columns: 13rem minmax(0, 1fr);
		column-gap: 2.5rem;
		align-items: start;
	}
	.minor > * {
		grid-column: 2;
	}
	.minor > h2 {
		grid-column: 1;
		margin: 0;
	}
	.minor > h2 + * {
		margin-block-start: 0;
	}
}

/* Figure: the visual and its caption, set straight on the page and aligned with the text. A figure the reader operates (an input,
   select, tabs or a stepper inside), or one marked .panel, becomes a panel: the box says these controls act on this. --pad is the
   inset of its children, --under the tone they sit on. */
.fig {
	--pad: 0px;
	container-type: inline-size;
	margin: 1.5rem 0;
}
.fig:is(.panel, [data-stepper], :has(input, select, textarea, [role="tablist"], .player)) {
	--pad: var(--inset);
	--under: var(--surface);
	background: var(--under);
	border: 1px solid var(--rule);
	border-radius: var(--radius);
	overflow: hidden;

	/* In a panel the diagram runs edge to edge on the blueprint surface; on a plain figure it sits on the page like a chart. */
	& > .mermaid {
		--under: var(--bg);
		background: var(--blueprint);
	}
}
.fig > * {
	padding-inline: var(--pad);
	margin: 0;
	max-inline-size: none;
}
.fig > :is(.bleed, .stage, .chart, .scroll, .compare, .mermaid, .dg, .split) {
	padding-inline: 0;
}
.fig > :is(h2, h3) {
	padding-block: 1rem 0.5rem;
	font-size: 1.0625rem;
	letter-spacing: -0.01em;
}
.fig > p:not([class]) {
	padding-block: 0.75rem;
}
.fig-visual {
	padding-block: 1rem;
	min-inline-size: 0;
}
/* Blueprint surface for diagrams; marks drawn on it sit on the page tone. */
.stage,
.fig-visual.stage {
	--under: var(--bg);
	background: var(--blueprint);
}
.fig-visual.stage {
	padding: 1rem 0;
	border-block: 1px solid var(--rule);
}
.fig > figcaption {
	padding-block: 0.875rem 1rem;
	color: var(--muted);
	font-size: 0.875rem;
	line-height: 1.55;
}
.fig > figcaption:not(:last-child) {
	border-block-end: 1px solid var(--rule);
}
/* Text beside its figure on wide screens, the figure taking two thirds; stacked on phones. Two children: the text, then the figure.
   It follows the .fig rules so its margin reset wins over the figure's own. */
.beside {
	display: grid;
	gap: 1rem 2.5rem;
	align-items: start;
	margin-block: 1.5rem;
}
.beside > * {
	min-inline-size: 0;
	margin-block: 0;
}
.beside > :first-child > :first-child {
	margin-block-start: 0;
}
@media (min-width: 56rem) {
	.beside {
		grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
	}
}
.src {
	display: block;
	margin-top: 0.25rem;
	font: 0.75rem / 1.5 var(--mono);
}
/* Columns divided by hairlines, edge to edge in a panel; each column carries its own inset. One column on phones. */
.split {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr));
	gap: 1px;
	background: var(--rule);
	border-block: 1px solid var(--rule);
}
/* A column paints the tone the split sits on and passes it on, even when the column is a .stage. */
.split > * {
	--under: inherit;
	min-inline-size: 0;
	margin: 0;
	padding: 0.875rem var(--inset) 1rem;
	background: var(--under);
}

/* theme part: charts, plots, Mermaid blocks, svg files per scheme, hand-built diagrams. */
/* Charts (kit:echarts.js + kit:charts.js, or kit:plot.js): the element needs a height; the chart fills it. */
.chart {
	inline-size: 100%;
	block-size: clamp(18rem, 48vw, 26rem);
	min-inline-size: 0;
}
.chart.tall {
	block-size: clamp(22rem, 60vw, 34rem);
}

/* Plots (kit:plot.js) on the same .chart element: a legend row above an SVG that fills the rest, drawn at pixel size so text stays 13 px. */
.plot {
	display: flex;
	flex-direction: column;
}
.plot-legend {
	display: flex;
	flex-wrap: wrap;
	gap: 0 1rem;
	margin: 0;
	padding: 0.5rem 1rem 0;
	list-style: none;
	font-size: 0.8125rem;
	line-height: 1.4;
}
.plot-legend button {
	display: flex;
	align-items: center;
	gap: 0.5rem;
	padding: 0.375rem 0;
	border: 0;
	background: none;
	font: inherit;
	color: var(--ink);
	cursor: pointer;
}
.plot-legend button[aria-pressed="false"] {
	--on: 0.35;
	color: var(--muted);
	text-decoration: line-through;
}
.plot-legend i {
	opacity: var(--on, 1);
	flex: none;
	inline-size: 1rem;
	block-size: 0.1875rem;
	border-radius: 1px;
	background: var(--c);
}
.plot-legend i.bar,
.plot-legend i.stem {
	block-size: 0.75rem;
	inline-size: 0.75rem;
	border-radius: 2px;
}
.plot-legend i.dash {
	background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 6px);
}
.plot-area {
	position: relative;
	flex: 1;
	min-block-size: 0;
}
.plot svg {
	position: absolute;
	inset: 0;
	inline-size: 100%;
	block-size: 100%;
	overflow: visible;
}
.plot text {
	font: 500 13px var(--font);
	fill: var(--muted);
	font-variant-numeric: tabular-nums;
}
.plot .name {
	fill: var(--muted);
}
.plot .value {
	fill: var(--ink);
	font-weight: 600;
	paint-order: stroke;
	stroke: var(--under);
	stroke-width: 3px;
	stroke-linejoin: round;
}
.plot .value.inside {
	fill: var(--surface);
	stroke: none;
}
.plot svg :is(.grid, .zero, .axis, .guide) {
	fill: none;
}
.plot svg .grid {
	stroke: var(--rule);
}
.plot svg :is(.zero, .axis) {
	stroke: var(--rule-strong);
}
.plot svg .guide {
	stroke: var(--accent);
	stroke-width: 1.5;
	stroke-dasharray: 2 4;
}
.plot svg :is(.line, .stem) {
	fill: none;
	stroke: var(--c);
	stroke-width: var(--w);
	stroke-linejoin: round;
	stroke-linecap: round;
}
.plot svg .line.dash {
	stroke-dasharray: 6 4;
}
.plot svg :is(.dot, .bar) {
	fill: var(--c);
}

/* Mermaid blocks: pack renders each to one SVG drawn with the renderer's private variables (--_line, --_node-fill, ...), set here
   from the kit's tokens, so a diagram follows light, dark and a page's own tokens. A diagram has no frame or surface of its own:
   bare or in a plain figure it sits on the tone around it like a chart; a box means controls, so only a panel frames it and gives
   it the blueprint surface (the panel rule in 02-layout.css). */
.mermaid {
	display: block;
	margin: 1.5rem 0;
	padding: 1.25rem 1rem;
	text-align: center;
	overflow-x: auto;
}
.fig > .mermaid {
	margin: 0;
}
/* The renderer fills edge-label boxes, hollow markers and end states with --bg: here the tone under the diagram, so a diagram in a
   band or panel has no page-coloured boxes. */
.mermaid > svg {
	--bg: var(--under);
	--fg: var(--ink);
	--_text: var(--ink);
	--_text-sec: var(--muted);
	--_text-muted: var(--muted);
	--_text-faint: color-mix(in srgb, var(--muted) 70%, var(--under));
	--_line: var(--muted);
	--_arrow: var(--muted);
	--_node-fill: var(--surface);
	--_node-stroke: var(--rule-strong);
	--_group-fill: transparent;
	--_group-hdr: var(--sunken);
	--_inner-stroke: var(--rule);
	--_key-badge: var(--sunken);
	font-family: var(--font);
	overflow: visible;
}
.mermaid > svg .mono {
	font-family: var(--mono);
}
/* pack inlines an svg file in <img> once per scheme; the copy shown follows the system scheme unless <html data-scheme> forces one
   (light-dark() cannot switch display). Only the other copy is hidden, so the page's own display rule for the <img> stays. */
:root[data-scheme="dark"] img.light,
:root[data-scheme="light"] img.dark {
	/* biome-ignore lint/complexity/noImportantStyles: the other copy of an svg file must hide even when the <img> carries an inline display */
	display: none !important;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-scheme="light"]) img.light {
		/* biome-ignore lint/complexity/noImportantStyles: the other copy of an svg file must hide even when the <img> carries an inline display */
		display: none !important;
	}
}
@media (prefers-color-scheme: light) {
	:root:not([data-scheme="dark"]) img.dark {
		/* biome-ignore lint/complexity/noImportantStyles: the other copy of an svg file must hide even when the <img> carries an inline display */
		display: none !important;
	}
}

/* Diagram panels: build the svg at the container's pixel width (viewBox = that width) so text stays 1:1 */
.dg {
	display: block;
	inline-size: 100%;
	block-size: auto;
	font: 500 13px var(--font);
}
.dg text {
	fill: var(--ink);
}
.dg .muted {
	fill: var(--muted);
}
.dg .cap {
	fill: var(--muted);
	font: 500 12px var(--mono);
}
.dg .node,
.dg .lane {
	fill: var(--surface);
	stroke: var(--rule-strong);
	stroke-width: 1.25;
}
.dg .lane.dashed {
	stroke-dasharray: 6 5;
	fill: color-mix(in srgb, var(--surface) 70%, transparent);
}
.dg .slot {
	fill: var(--sunken);
	stroke: var(--rule-strong);
	stroke-width: 1.25;
}
.dg .slot.cached {
	stroke: var(--accent);
	stroke-dasharray: 4 3;
	stroke-width: 1.5;
	fill: var(--surface);
}
.dg .slot.solid {
	fill: var(--accent-soft);
	stroke: var(--accent);
	stroke-width: 1.5;
}
.dg .slot.lost {
	stroke: var(--bad);
	stroke-dasharray: 2 3;
	fill: none;
}
.dg .edge {
	stroke: var(--accent);
	stroke-width: 2;
	fill: none;
}
.dg .edge.quiet {
	stroke: var(--muted);
	stroke-width: 1.25;
}
.dg .elabel {
	fill: var(--accent);
	font: 500 12px var(--mono);
	paint-order: stroke;
	stroke: var(--under);
	stroke-width: 5px;
	stroke-linejoin: round;
}
/* Not reached yet: faded and dashed, so it differs from reached marks by shape as well as by tone in both themes. */
.dg .future {
	opacity: 0.5;
	stroke-dasharray: 3 3;
}

/* TanStack Charts (spike, kit TChart): the kit's series colours and text through the library's own variables. */
.tchart {
	--tchart-height: clamp(18rem, 48vw, 26rem);
	--ts-chart-1: var(--c1);
	--ts-chart-2: var(--c2);
	--ts-chart-3: var(--c3);
	--ts-chart-4: var(--c4);
	--ts-chart-5: var(--c5);
	--ts-chart-6: var(--c6);
	--ts-chart-tooltip-background: var(--surface);
	--ts-chart-tooltip-color: var(--ink);
	--ts-chart-tooltip-border: 1px solid var(--rule);
	--ts-chart-tooltip-font: 13px / 1.4 var(--font);
	inline-size: 100%;
	min-inline-size: 0;
	color: var(--ink);
	font: 13px var(--font);
}
.tchart.tall {
	--tchart-height: clamp(22rem, 60vw, 34rem);
}

/* theme part: control row, fields, segmented choice, toggle, inputs, buttons, playback, tabs. */
/* Controls: a row at the top of a panel. Field captions keep the case you write. */
.controls {
	display: flex;
	flex-wrap: wrap;
	gap: 0.75rem 1.5rem;
	align-items: center;
	padding-block: 0.875rem;
	border-block-end: 1px solid var(--rule);
	font-size: 0.875rem;
}
.controls:has(+ .controls) {
	padding-block-end: 0.25rem;
	border-block-end: 0;
}
.field {
	display: inline-flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 0.25rem 0.625rem;
}
.field > span:first-child {
	font-size: 0.8125rem;
	font-weight: 500;
	color: var(--muted);
}
/* A slider field takes the row's spare width, so caption, slider and readout stay on one line on a phone. */
.controls > .field:has(> input[type="range"]) {
	flex: 1 1 16rem;
	flex-wrap: nowrap;
	max-inline-size: 30rem;
}
.field > input[type="range"] {
	flex: 1 1 4rem;
	min-inline-size: 4rem;
	inline-size: auto;
}
.field > output {
	min-inline-size: 3ch;
}
fieldset {
	min-inline-size: 0;
	margin: 1.25rem 0;
	padding: 0;
	border: 0;
}
legend {
	margin-block-end: 0.625rem;
	padding: 0;
	font-weight: 600;
}
/* Segmented choice: a sunken track; the chosen option is a raised tile in bold ink. */
.seg {
	display: inline-flex;
	flex-wrap: wrap;
	gap: 2px;
	padding: 2px;
	background: var(--sunken);
	border: 1px solid var(--rule);
	border-radius: 0.5rem;
}
.seg label {
	position: relative;
	display: block;
}
.seg input {
	position: absolute;
	inset: 0;
	margin: 0;
	opacity: 0;
	cursor: pointer;
}
.seg span {
	display: block;
	padding: 0.3125rem 0.75rem;
	min-block-size: 2rem;
	line-height: 1.375rem;
	border-radius: 0.375rem;
	color: var(--muted);
	transition:
		background 0.15s,
		color 0.15s;
}
/* In a .toolbar (below), the switch is as tall as the inputs beside it. */
.toolbar .seg span {
	min-block-size: 0;
	padding-block: 0.25rem;
}
.seg label:hover span {
	color: var(--ink);
}
.seg input:checked + span {
	background: var(--surface);
	color: var(--ink);
	font-weight: 600;
	box-shadow:
		0 0 0 1px var(--rule-strong),
		0 1px 3px var(--lift);
}
.seg input:focus-visible + span {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
}
.toggle {
	display: inline-flex;
	align-items: center;
	gap: 0.5rem;
	cursor: pointer;
	min-block-size: 2.25rem;
}
.toggle input {
	appearance: none;
	margin: 0;
	inline-size: 2.125rem;
	block-size: 1.25rem;
	border-radius: 1rem;
	background: color-mix(in oklab, var(--muted) 75%, var(--surface));
	position: relative;
	cursor: pointer;
	transition: background 0.15s;
	flex: none;
}
.toggle input::after {
	content: "";
	position: absolute;
	inset: 0.1875rem auto 0.1875rem 0.1875rem;
	aspect-ratio: 1;
	border-radius: 50%;
	background: var(--surface);
	transition: transform 0.2s var(--ease);
}
.toggle input:checked {
	background: var(--swatch, var(--accent));
}
.toggle input:checked::after {
	transform: translateX(0.875rem);
}
.toggle input:disabled {
	opacity: 0.4;
	cursor: not-allowed;
}
.toggle input:not(:checked) + span {
	color: var(--muted);
}
select,
input[type="number"],
input[type="text"],
input[type="search"],
input[type="date"],
textarea {
	padding: 0.3125rem 0.5rem;
	min-block-size: 2.25rem;
	border: 1px solid var(--rule-strong);
	border-radius: 0.375rem;
	background: var(--surface);
}
/* A free-response field: the width of its column, taller only by the reader's hand. */
textarea {
	display: block;
	inline-size: 100%;
	resize: vertical;
}
/* biome-ignore lint/style/noDescendingSpecificity: the .field-scoped slider rule above outranks this default by specificity, so their order does not matter */
input[type="range"] {
	accent-color: var(--accent);
	inline-size: min(14rem, 60vw);
}
/* biome-ignore lint/style/noDescendingSpecificity: the .field-scoped readout rule above sets only min-inline-size, a property this default leaves alone */
output {
	font: 500 0.8125rem var(--mono);
	font-variant-numeric: tabular-nums;
}
.btn {
	min-block-size: 2.25rem;
	padding: 0.375rem 0.875rem;
	background: var(--surface);
	border: 1px solid var(--rule-strong);
	border-radius: 0.375rem;
	font-size: 0.875rem;
	font-weight: 500;
	cursor: pointer;
	transition:
		border-color 0.15s,
		background 0.15s;
}
.btn:hover:not(:disabled) {
	border-color: var(--ink);
}
.btn:disabled {
	opacity: 0.4;
	cursor: default;
}
.btn.primary {
	background: var(--accent);
	border-color: var(--accent);
	color: var(--accent-ink);
	font-weight: 600;
}
.btn.primary:hover:not(:disabled) {
	background: color-mix(in oklab, var(--accent) 88%, var(--ink));
	border-color: transparent;
}
.reset {
	margin-inline-start: auto;
	background: none;
	border: 0;
	padding: 0;
	color: var(--accent);
	cursor: pointer;
	text-decoration: underline;
	text-decoration-thickness: 1px;
	text-underline-offset: 0.2em;
	min-block-size: 2.25rem;
}
/* Playback: Back / Play / Next, a range over the steps, and a step counter in an output */
.player {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 0.5rem 0.75rem;
	padding-block: 0.875rem;
}
.player input[type="range"] {
	flex: 1 1 8rem;
}

/* Tabs for parallel panels inside one figure; not for page navigation (use sections or views) */
[role="tablist"] {
	display: flex;
	gap: 0.25rem;
	border-block-end: 1px solid var(--rule);
	overflow-x: auto;
}
[role="tab"] {
	background: none;
	border: 0;
	border-block-end: 2px solid transparent;
	padding: 0.625rem 0.75rem 0.5rem;
	color: var(--muted);
	cursor: pointer;
	white-space: nowrap;
}
[role="tab"]:hover {
	color: var(--ink);
}
[role="tab"][aria-selected="true"] {
	color: var(--ink);
	font-weight: 600;
	border-block-end-color: var(--accent);
}
[role="tabpanel"] {
	padding-block: 1rem;
}

/* Toolbar: the row over a records section on the page (a tree or table), holding its view switch (.seg), search and filters
   (selects, .field), compact on one line with no box. On phones it is a grid of two equal columns: the switch and the search take
   a row each, the filters pair up, so the rows wrap as whole cells, never as a ragged line. Layout only: the page owns what the
   controls do. Unlike .controls, which heads a panel's figure, it acts on records below it that sit on the page. */
.toolbar {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 0.5rem 0.75rem;
	margin-block: 1.25rem 0.75rem;
	font-size: 0.875rem;
}
.toolbar > input[type="search"] {
	flex: 1 1 10rem;
	max-inline-size: 18rem;
}
@media (max-width: 40rem) {
	.toolbar {
		display: grid;
		grid-template-columns: repeat(2, minmax(0, 1fr));
	}
	.toolbar > * {
		min-inline-size: 0;
	}
	.toolbar > :is(.seg, input[type="search"]) {
		grid-column: 1 / -1;
		max-inline-size: none;
	}
	.toolbar > .seg {
		display: flex;
	}
	.toolbar > .seg label {
		flex: 1;
		text-align: center;
	}
	.toolbar > :is(select, .field) {
		inline-size: 100%;
	}
	.toolbar .field > select {
		flex: 1;
		min-inline-size: 0;
	}
}
/* Self-check (a Question with an answer): once the reader chooses, the right option is ringed in --ok, a wrong choice is ringed
   in --bad and struck through, and the explanation opens. CSS alone, so a choice kit:keep.js restores is marked as well. */
.self-check > .explain {
	margin-block-start: 0.75rem;
}
.self-check:not(:has(input:checked)) > .explain {
	display: none;
}
.self-check input:checked:not([data-right]) + span {
	color: var(--bad);
	text-decoration: line-through;
	box-shadow: inset 0 0 0 2px var(--bad);
}
.self-check:has(input:checked) input[data-right] + span {
	color: var(--ok);
	font-weight: 600;
	box-shadow: inset 0 0 0 2px var(--ok);
}
/* Written answer (a Question without options): the question, its box and the model answer keep the measure of the text. */
.written {
	max-inline-size: 66ch;
}

/* theme part: readouts, chips, ranking rows, comparison tables. */
/* Readouts: plain numbers in a row, no tiles. <small> is a second line under the number. */
.stats {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 5.5rem), 1fr));
	gap: 1rem clamp(1rem, 4cqi, 2.5rem);
	margin: 1.25rem 0;
	padding: 0;
}
/* Element-qualified so older page overrides that zeroed the panel inset (.fig > .stats { padding: 0 }) no longer apply. */
.fig > :is(dl, div, ul).stats {
	margin: 0;
	padding: 1rem var(--pad) 0.5rem;
}
/* Caption and number share rows across the line (subgrid): when one caption wraps, the numbers still line up. */
.stat {
	display: grid;
	grid-row: span 2;
	grid-template-rows: subgrid;
	row-gap: 0;
	min-inline-size: 0;
	margin: 0;
}
.stat dt {
	font-size: 0.8125rem;
	font-weight: 500;
	line-height: 1.35;
	color: var(--muted);
}
.stat dd {
	margin: 0.25rem 0 0;
	font-size: clamp(1.375rem, 5cqi, 2.125rem);
	font-weight: 650;
	line-height: 1.1;
	letter-spacing: -0.03em;
	font-variant-numeric: tabular-nums;
}
.stat dd small {
	display: block;
	margin-block-start: 0.25rem;
	font: 400 0.8125rem / 1.4 var(--font);
	letter-spacing: 0;
	color: var(--muted);
}
/* Chip: a short status word beside a name. */
.chip {
	display: inline-flex;
	align-items: center;
	gap: 0.375rem;
	padding: 0 0.4375rem;
	border-radius: 0.25rem;
	background: color-mix(in oklab, currentColor 11%, transparent);
	color: var(--muted);
	font: 600 0.75rem / 1.6 var(--font);
	white-space: nowrap;
}
.chip.ok {
	color: var(--ok);
}
.chip.warn {
	color: var(--warn);
}
.chip.bad {
	color: var(--bad);
}
.chip.info {
	color: var(--info);
}
/* Category marker: a chip that starts with an empty <i> is a square in --swatch (the category's --c colour) before its word, with
   no tint, so a column of them stays quiet. The same markup keys the categories in a .legend over the records and marks the rows. */
.chip:has(> i:empty:first-child) {
	padding: 0;
	background: none;
	font-weight: 500;
}
.chip > i:empty {
	flex: none;
	inline-size: 0.5625rem;
	block-size: 0.5625rem;
	border-radius: 2px;
	background: var(--swatch, currentColor);
}
.legend {
	display: flex;
	flex-wrap: wrap;
	gap: 0.25rem 1rem;
	margin-block: 0.75rem;
}

/* Ranking rows: ol.rank > li > button (aria-expanded) + .more (inline detail, hidden until opened) */
.rank {
	list-style: none;
	margin: 0;
	padding: 0;
	/* biome-ignore lint/complexity/noImportantStyles: a ranking list is full width wherever it sits, over the .page prose measure and page rules */
	max-inline-size: none !important;
}
.rank > li {
	border-block-end: 1px solid var(--rule);
}
.rank > li:last-child {
	border-block-end: 0;
}
.rank > li > button {
	display: grid;
	grid-template-columns: minmax(4rem, 7rem) 1fr minmax(3.5rem, 6rem);
	align-items: center;
	gap: 0.75rem;
	inline-size: 100%;
	padding: 0.625rem 0;
	background: none;
	border: 0;
	text-align: start;
	cursor: pointer;
}
.rank .name {
	font-weight: 600;
}
.rank .bar {
	display: flex;
	block-size: 0.875rem;
	background: var(--sunken);
	border-radius: 0.1875rem;
	overflow: hidden;
}
.rank .bar i {
	display: block;
	block-size: 100%;
	inline-size: var(--w, 0%);
	background: var(--swatch, var(--accent));
	transition: inline-size 0.45s var(--ease);
}
.rank .val {
	text-align: end;
	font: 500 0.875rem var(--mono);
	font-variant-numeric: tabular-nums;
}
.rank > li > button:hover .name,
.rank > li > button[aria-expanded="true"] .name {
	color: var(--accent);
}
.rank .more {
	padding: 0.25rem 0 1rem;
}

/* Comparison matrix; theme.css documents the markup. Wide: a table. On phones each row becomes a stack of label/value lines.
   class="compare table" keeps a real table on phones: wrap it in .scroll so it scrolls sideways (numeric data tables). */
.scroll {
	overflow-x: auto;
}
.compare {
	border-collapse: collapse;
	inline-size: 100%;
	font-size: 0.9375rem;
}
.compare th,
.compare td {
	padding: 0.625rem 0.875rem;
	text-align: start;
	vertical-align: top;
	border-block-end: 1px solid var(--rule);
}
.compare thead th {
	font-size: 0.8125rem;
	font-weight: 500;
	color: var(--muted);
	vertical-align: bottom;
	border-block-end-color: var(--rule-strong);
}
.fig .compare :is(th, td):first-child {
	padding-inline-start: var(--pad);
}
.fig .compare :is(th, td):last-child {
	padding-inline-end: var(--pad);
}
.compare tbody tr:last-child > * {
	border-block-end: 0;
}
.compare tbody th {
	font-weight: 600;
	min-inline-size: 7rem;
}
:where(.compare) tr[data-state="fit"] > :first-child {
	box-shadow: inset 3px 0 0 var(--ok);
}
:where(.compare) tr[data-state="maybe"] > :first-child {
	box-shadow: inset 3px 0 0 var(--info);
}
/* biome-ignore lint/style/noDescendingSpecificity: the rules above with higher specificity set border-block-end on these cells, never color */
.compare tr[data-state="out"] > * {
	color: var(--muted);
}
.compare tr[data-state="out"] > th {
	font-weight: 500;
}
.compare .val {
	display: block;
	font: 0.75rem var(--mono);
	color: var(--muted);
}
.compare .why {
	display: block;
	margin-top: 0.125rem;
	font-size: 0.8125rem;
	color: var(--muted);
}
.compare tr.evidence > td {
	padding-block: 0.25rem 1rem;
}
/* A numeric column: class="num" on its header and cells, so amounts line up by their last digit. */
.compare .num {
	text-align: end;
	font-variant-numeric: tabular-nums;
}
.expand {
	background: none;
	border: 0;
	padding: 0.25rem 0;
	color: var(--accent);
	font-size: 0.875rem;
	font-weight: 500;
	cursor: pointer;
	min-block-size: 2rem;
	white-space: nowrap;
}
.expand::after {
	content: " +";
}
.expand[aria-expanded="true"]::after {
	content: " \2212";
}
.mark {
	white-space: nowrap;
	font-weight: 500;
}
.mark::before {
	content: "";
	display: inline-block;
	inline-size: 0.625rem;
	block-size: 0.625rem;
	margin-inline-end: 0.4rem;
	border-radius: 50%;
	border: 2px solid currentColor;
	vertical-align: -0.05em;
}
.mark.yes {
	color: var(--ok);
}
.mark.yes::before {
	background: currentColor;
}
.mark.part {
	color: var(--warn);
}
.mark.part::before {
	background: linear-gradient(90deg, currentColor 50%, transparent 50%);
}
.mark.no {
	color: var(--bad);
}
.mark.unk {
	color: var(--info);
}
.mark.unk::before {
	border-style: dotted;
}
/* Phone layout at low specificity (:where) so a page rule such as `.compare td.off { display: none }` still wins. */
@media (max-width: 48rem) {
	:where(.compare:not(.table)) thead {
		display: none;
	}
	:where(.compare:not(.table)),
	:where(.compare:not(.table)) :is(tbody, tr, th, td) {
		display: block;
	}
	:where(.compare:not(.table)) tr {
		padding: 0.75rem 0;
		border-block-end: 1px solid var(--rule);
	}
	:where(.compare:not(.table)) tbody tr:last-child {
		border-block-end: 0;
	}
	:where(.compare:not(.table)) tr[data-state] {
		padding-inline-start: 0.75rem;
		border-inline-start: 3px solid transparent;
	}
	:where(.fig) :where(.compare:not(.table)) tr {
		padding-inline: var(--pad);
	}
	:where(.fig) :where(.compare:not(.table)) tr[data-state] {
		padding-inline-start: max(calc(var(--pad) - 3px), 0.75rem);
	}
	:where(.compare:not(.table)) tr[data-state="fit"] {
		border-inline-start-color: var(--ok);
	}
	:where(.compare:not(.table)) tr[data-state="maybe"] {
		border-inline-start-color: var(--info);
	}
	/* Cells drop their table padding, rules, state tints and numeric alignment (a value reads beside its label); this must beat
	   the wide-layout cell rules above. */
	.compare:not(.table) tr > :is(th, td),
	.fig .compare:not(.table) tr > :is(th, td) {
		padding: 0.1875rem 0;
		text-align: start;
		border: 0;
		box-shadow: none;
		background: none;
	}
	:where(.compare:not(.table)) tbody th {
		min-inline-size: 0;
		padding-block-end: 0.375rem;
	}
	/* A table, not a grid: the cell's text, <i>, <code> and other inline pieces share one anonymous column beside the label. */
	:where(.compare:not(.table)) td[data-label] {
		display: table;
		table-layout: fixed;
		border-collapse: separate; /* the table's collapsing model, inherited from .compare, would drop the cell's own padding */
		border-spacing: 0;
		inline-size: 100%;
	}
	:where(.compare:not(.table)) td[data-label]::before {
		content: attr(data-label);
		display: table-cell;
		box-sizing: content-box;
		inline-size: 36%;
		min-inline-size: 5.5rem;
		padding-inline-end: 0.75rem;
		color: var(--muted);
		font-size: 0.8125rem;
	}
	:where(.compare:not(.table)) tr.evidence {
		margin-block-start: -0.75rem;
		padding-block-start: 0;
	}
}

/* theme part: caveats, details, drill-down views, reduced motion, print. */
/* Caveat: one line beside the claim it changes; the rest goes in <details>. <b> names the kind (Inferred, Unknown). */
.caveat {
	max-inline-size: 66ch;
	margin: 1.25rem 0;
	padding: 0.625rem 0.875rem;
	background: var(--warn-soft);
	border-radius: 0.5rem;
	font-size: 0.9375rem;
}
.caveat b {
	font-weight: 600;
	color: var(--warn);
	margin-inline-end: 0.5rem;
}
.caveat > :first-child {
	margin-top: 0;
}
.caveat > :last-child {
	margin-bottom: 0;
}
.detail {
	margin: 0.75rem 0;
	padding: 0.875rem 1rem;
	background: var(--surface);
	border: 1px solid var(--rule);
	border-radius: var(--radius);
}
details {
	margin: 1.25rem 0;
	border-block: 1px solid var(--rule);
}
summary {
	display: flex;
	align-items: center;
	gap: 0.5rem;
	min-block-size: 2.75rem;
	list-style: none;
	cursor: pointer;
	font-size: 0.9375rem;
	font-weight: 500;
}
summary::-webkit-details-marker {
	display: none;
}
summary::before {
	content: "";
	flex: none;
	inline-size: 0.4375rem;
	block-size: 0.4375rem;
	margin-inline: 0.125rem 0.25rem;
	border: solid var(--muted);
	border-width: 0 1.5px 1.5px 0;
	transform: rotate(-45deg);
	transition: transform 0.2s var(--ease);
}
details[open] > summary::before {
	transform: rotate(45deg) translate(-0.125rem, -0.0625rem);
}
summary:hover {
	color: var(--accent);
}
details[open] > summary {
	margin-block-end: 0.25rem;
}
details > :last-child:not(summary) {
	margin-block-end: 1rem;
}
.fig > details {
	margin: 0;
	border-block-end: 0;
}

/* Views (kit:views.js): the overview is the page; #name/param shows <section class="view" data-view="name">.
   Without JS every view stays visible below the overview; print shows everything but a filled view (data-fill), which holds
   only the record open, and so shows and prints only while it is open. */
.view {
	margin-block-start: clamp(3.5rem, 9vw, 6rem);
	padding-block-start: 1.5rem;
	border-block-start: 1px solid var(--rule);
}
.js-views .view.active {
	margin-block-start: 0;
	padding-block-start: 0;
	border: 0;
}
.view-head {
	margin-block-end: 2rem;
}
.back {
	display: inline-flex;
	align-items: center;
	gap: 0.5rem;
	margin-block-end: 1.5rem;
	min-block-size: 2.25rem;
	font-size: 0.9375rem;
	font-weight: 500;
	text-decoration: none;
}
.back::before {
	content: "";
	inline-size: 0.4375rem;
	block-size: 0.4375rem;
	border: solid currentColor;
	border-width: 1.5px 0 0 1.5px;
	transform: rotate(-45deg);
}
.back:hover {
	text-decoration: underline;
}
.view-head h1 {
	margin-block: 0 0.75rem;
	font-size: clamp(1.875rem, 4.2vw, 2.75rem);
}
.js-views .view:not(.active) {
	display: none;
}
.js-views.in-view [data-overview] {
	display: none;
}
.view[data-fill]:not(.active) {
	display: none;
}

@media (prefers-reduced-motion: reduce) {
	*,
	*::before,
	*::after {
		/* biome-ignore lint/complexity/noImportantStyles: reduced motion must beat every transition and animation, including a page's own */
		transition: none !important;
		/* biome-ignore lint/complexity/noImportantStyles: reduced motion must beat every transition and animation, including a page's own */
		animation: none !important;
	}
}
@media print {
	.controls,
	.player,
	[role="tablist"],
	.back {
		display: none;
	}
	.js-views .view:not(.active, [data-fill]),
	.js-views.in-view [data-overview] {
		/* biome-ignore lint/complexity/noImportantStyles: print shows every static view, over the display rules of the screen layout */
		display: block !important;
	}
	/* Every fold prints open. A closed <details> hides its content box, not its children, so the box is what is shown. */
	details::details-content {
		content-visibility: visible;
	}
	summary::before {
		transform: rotate(45deg) translate(-0.125rem, -0.0625rem);
	}
	.fig {
		break-inside: avoid;
	}
}

/* theme part: navigation kit:views.js builds from the page's own markup: breadcrumbs and previous/next in a view (.trail), the
   contents rail (.toc) and Expand all (.fold-all). Pages write none of these classes. */
/* Trail: breadcrumbs on the left, previous / position / next on the right; on phones the siblings take a row of their own. */
.trail {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	justify-content: space-between;
	gap: 0 1.5rem;
	margin-block-end: 1.25rem;
	font-size: 0.9375rem;
}
.crumbs,
.sibs {
	display: flex;
	align-items: center;
	min-inline-size: 0;
}
.crumbs {
	flex-wrap: wrap;
	margin: 0;
	padding: 0;
	list-style: none;
}
.crumbs li {
	display: flex;
	align-items: center;
	min-inline-size: 0;
}
/* The separator and the previous/next arrows are the border-drawn chevron of .back and summary. */
:is(.crumbs li + li, .sibs [rel="prev"])::before,
.sibs [rel="next"]::after {
	content: "";
	flex: none;
	inline-size: 0.375rem;
	block-size: 0.375rem;
	border: solid currentColor;
	border-width: 1.5px 1.5px 0 0;
	transform: rotate(45deg);
}
.crumbs li + li::before {
	margin-inline: 0.375rem 0.625rem;
	color: var(--muted);
}
/* Turned, a chevron's corners stand out of its box: room inside the link, which may end at the viewport's edge. */
.sibs [rel="prev"]::before {
	margin-inline-start: 0.125rem;
	transform: rotate(-135deg);
}
.sibs [rel="next"]::after {
	margin-inline-end: 0.125rem;
}
/* Names wrap; nothing in the navigation is cut off. */
.crumbs :is(a, span),
.sibs a {
	padding-block: 0.5rem;
	font-weight: 500;
	line-height: 1.35;
	text-decoration: none;
}
.crumbs :is(a, span) {
	max-inline-size: 16rem;
}
/* The view's own .back link as the first crumb: its chevron and spacing give way to the trail's. */
.crumbs .back {
	display: block;
	margin: 0;
}
.crumbs .back::before {
	content: none;
}
.crumbs [aria-current] {
	color: var(--muted);
	font-weight: 400;
}
.sibs {
	gap: 0.75rem;
	font-size: 0.875rem;
}
.sibs a {
	display: inline-flex;
	align-items: center;
	gap: 0.5rem;
	max-inline-size: 11rem;
}
:is(.crumbs, .sibs) a:hover {
	text-decoration: underline;
}
.sibs .count {
	flex: none;
	color: var(--muted);
	font: 0.8125rem var(--mono);
	font-variant-numeric: tabular-nums;
}
@media (max-width: 40rem) {
	.sibs {
		inline-size: 100%;
		justify-content: space-between;
		border-block-start: 1px solid var(--rule);
	}
	.sibs > :not(.count) {
		inline-size: 40%;
	}
	.sibs [rel="next"] {
		justify-content: flex-end;
	}
}

/* Contents rail. From 64rem it is fixed in the page's left margin and the page grows by the rail, so the reading column keeps
   its width, and it moves out into the window's margin by as much as .wide grows (--wide-reach); below that it is a closed
   disclosure at the top of the page. Transparent, so a .band's tone runs under it. */
.toc ol {
	margin: 0;
	padding: 0;
	list-style: none;
}
.toc a {
	display: block;
	padding: 0.3125rem 0.75rem;
	border-inline-start: 2px solid transparent;
	color: var(--muted);
	font-size: 0.875rem;
	line-height: 1.35;
	text-decoration: none;
}
.toc a:hover,
.toc a:is([aria-current], .is-trail) {
	color: var(--ink);
}
.toc a:is([aria-current], .is-trail) {
	font-weight: 600;
}
.toc a[aria-current] {
	border-inline-start-color: var(--accent);
}
/* A trail step's siblings, on a hairline under their section; the current one carries the accent bar onto the line. */
.toc ol ol {
	margin: 0.125rem 0 0.5rem 0.75rem;
	border-inline-start: 1px solid var(--rule);
}
.toc ol ol a {
	margin-inline-start: -1px;
	padding-block: 0.25rem;
	font-size: 0.8125rem;
}
.toc-toggle {
	display: flex;
	align-items: center;
	gap: 0.5rem;
	inline-size: 100%;
	min-block-size: 2.75rem;
	padding: 0;
	background: none;
	border: 0;
	color: var(--ink);
	font-size: 0.9375rem;
	font-weight: 500;
	cursor: pointer;
}
.toc-toggle::before {
	content: "";
	inline-size: 0.4375rem;
	block-size: 0.4375rem;
	margin-inline: 0.125rem 0.25rem;
	border: solid var(--muted);
	border-width: 0 1.5px 1.5px 0;
	transform: rotate(-45deg);
	transition: transform 0.2s var(--ease);
}
.toc-toggle[aria-expanded="true"]::before {
	transform: rotate(45deg) translate(-0.125rem, -0.0625rem);
}
@media (max-width: 63.99rem) {
	.toc {
		margin-block: -0.75rem 1.75rem;
		border-block-end: 1px solid var(--rule);
	}
	.toc > ol {
		max-block-size: 60vh;
		overflow-y: auto;
		padding-block-end: 0.75rem;
	}
	.toc:not(.is-open) > ol {
		display: none;
	}
}
@media (min-width: 64rem) {
	/* How far .wide grows to each side of the column beside the rail: the page box's margin less the window's gutter, at most
	   11rem, so a 66rem column grows to 88rem as without the rail. The rail moves out into its margin by as much, so its gap to a
	   .wide block stays the 2.5rem it keeps from the column, and the growth is the same on both sides: the page box is centred. The
	   margin is that of the page box below, with 50vw for half its 100%; a classic scrollbar's width, which vw also counts, stays
	   within the gutter. */
	.has-toc {
		--wide-reach: clamp(0px, 50vw - min(50vw - var(--gutter), 40.5rem) - var(--gutter), 11rem);
	}
	.has-toc .page {
		inline-size: min(100% - 2 * var(--gutter), 81rem);
		padding-inline-start: 15rem;
	}
	.toc {
		position: fixed;
		z-index: 1;
		inset-block: 0;
		inset-inline-start: calc((100% - min(100% - 2 * var(--gutter), 81rem)) / 2 - var(--wide-reach));
		inline-size: 12.5rem;
		padding-block: clamp(1.75rem, 5vw, 3.5rem) 2rem;
		overflow-y: auto;
		overscroll-behavior: contain;
		scrollbar-width: thin;
	}
	.toc-toggle {
		display: none;
	}
	/* .wide stays centred on the column; Expand all over it ends with it. */
	.has-toc .wide {
		margin-inline: calc(-1 * var(--wide-reach));
	}
	.has-toc .fold-all:has(+ .wide) {
		margin-inline-end: calc(-1 * var(--wide-reach));
	}
}

/* Expand all: right-aligned just above the section's first fold, without .expand's +/- suffix. */
.fold-all {
	display: block;
	margin-block: 1.25rem -1rem;
	margin-inline: auto 0;
}
.expand.fold-all::after {
	content: none;
}
/* In a .toolbar it ends the row; on phones it takes the last column. */
.toolbar > .fold-all {
	grid-column: -2;
	margin: 0;
	margin-inline-start: auto;
}
/* Over a .wide block it takes the block's margins (the layout part) but keeps to the end. */
.fold-all:has(+ .wide) {
	margin-inline-start: auto;
}

@media print {
	.trail,
	.toc,
	.fold-all {
		display: none;
	}
	.has-toc .page {
		padding-inline-start: 0;
	}
}

/* theme part: .tree, hierarchical records as nested <details>: one row per item, its label then its numbers in aligned columns.
   A row is a <summary>, a link that stands as a row, or the .tree-head that names the columns; every child of a row is a cell, the
   label first. A row is a grid of the chevron's column, the label's, then the number columns of --tree-cols, one width per column.
   Each level is indented by the chevron's column and gap, so a child's chevron sits under its parent's label, and the number
   columns, right-aligned at the row's end, line up across rows and levels. Rows are matched through :where(), so the rules below
   rise in specificity in source order. */
.tree {
	margin-block: 1.25rem;
	border-block-end: 1px solid var(--rule);
	font-size: 0.9375rem;
}
/* Unset, --tree-cols is one column per number cell, up to six (--tree-n, counted below), each 5rem where the row has room and
   narrower where it has not, so a deep row on a small phone shrinks its columns rather than scrolling sideways. */
.tree :where(summary, .tree > a, details > a, .tree > .tree-head) {
	--tree-n: 1;
	display: grid;
	grid-template-columns: 0.8125rem minmax(0, 1fr) var(
			--tree-cols,
			repeat(var(--tree-n), minmax(0, 5rem))
		);
	align-items: baseline;
	gap: 0 0.5rem;
	min-block-size: 2.5rem;
	padding-block: 0.5625rem;
	border-block-start: 1px solid var(--rule);
	line-height: 1.35;
}
.tree :where(summary, .tree > a, details > a, .tree > .tree-head):has(> :nth-child(3)) {
	--tree-n: 2;
}
.tree :where(summary, .tree > a, details > a, .tree > .tree-head):has(> :nth-child(4)) {
	--tree-n: 3;
}
.tree :where(summary, .tree > a, details > a, .tree > .tree-head):has(> :nth-child(5)) {
	--tree-n: 4;
}
.tree :where(summary, .tree > a, details > a, .tree > .tree-head):has(> :nth-child(6)) {
	--tree-n: 5;
}
.tree :where(summary, .tree > a, details > a, .tree > .tree-head):has(> :nth-child(7)) {
	--tree-n: 6;
}
/* A link row and the head have no chevron: their label starts in its own column, where its sibling summaries' labels do. */
.tree :where(summary, .tree > a, details > a, .tree > .tree-head) > :first-child {
	grid-column: 2;
	min-inline-size: 0;
}
/* A row of a label alone gives it the row. */
.tree :where(summary, .tree > a, details > a, .tree > .tree-head) > :only-child {
	grid-column: 2 / -1;
}
.tree :where(summary, .tree > a, details > a, .tree > .tree-head) > * + * {
	min-inline-size: 0;
	color: var(--muted);
	font-size: 0.875rem;
	font-variant-numeric: tabular-nums;
	text-align: end;
	overflow-wrap: anywhere;
}
.tree :where(.tree > a, details > a) {
	font-weight: 400;
	text-decoration: none;
}
.tree :where(.tree > a, details > a):hover > :first-child {
	text-decoration: underline;
}
/* The head: the columns' names over the first row, in the numbers' size. */
.tree > .tree-head {
	min-block-size: 0;
	padding-block: 0 0.375rem;
	border-block-start: 0;
	color: var(--muted);
	font-size: 0.875rem;
	font-weight: 500;
}
.tree details {
	margin: 0;
	border: 0;
}
/* The chevron is an empty box with no baseline of its own: it is centred on the first line instead. */
.tree summary::before {
	align-self: start;
	margin-block-start: 0.375rem;
}
/* Levels by weight: the top level and its totals strongest, a leaf (a fold with no fold inside) plain. */
.tree > details > summary {
	font-weight: 600;
}
.tree > details > summary > * + * {
	color: var(--ink);
}
/* Everything under a row is one level in: nested rows, and the text a leaf opens to. */
.tree details > :not(summary) {
	margin-inline-start: 1.3125rem;
}
/* A leaf's full text, under its row. */
.tree details > :not(summary, details, a) {
	max-inline-size: 66ch;
	margin-block: 0 0.875rem;
}
.tree details:not(:has(details)) > summary {
	font-weight: 400;
}
/* Rows run on with no gap between them. */
.tree details[open] > summary,
.tree details > :is(details, a):last-child {
	margin-block-end: 0;
}
/* A closed branch that holds a row kit:link.js lights is tinted as the row would be. */
.tree details:not([open]):has(.is-lit) > summary {
	background: var(--accent-soft);
}
/* Phones: a row with two or more numbers gives its label the first line and puts the numbers on the second, in the same columns
   right-aligned; a single number stays on the label's line. The label spans every column, and the first number starts in its own
   column, which the label holds on the first line, so the numbers go to the second. */
@media (max-width: 40rem) {
	.tree :where(summary, .tree > a, details > a, .tree > .tree-head) {
		row-gap: 0.125rem;
	}
	.tree :where(summary, .tree > a, details > a, .tree > .tree-head) > * + * {
		font-size: 0.8125rem;
	}
	.tree
		:where(summary, .tree > a, details > a, .tree > .tree-head):has(> :nth-child(3))
		> :first-child {
		grid-area: 1 / 2 / 2 / -1;
	}
	.tree
		:where(summary, .tree > a, details > a, .tree > .tree-head):has(> :nth-child(3))
		> :nth-child(2) {
		grid-column-start: 3;
	}
}

/* theme: quiet warm-paper house style, light and dark from the system setting; page shell, panels, controls, charts, diagrams, views, trees.
   One loud thing per screen, the headline; everything else is set in plain sentence case and recedes. Labels keep the case you write.
   Per topic, set only the accent, dark enough for white text in light mode and light in dark mode:
     :root { --accent: light-dark(#1f5fbf, #7fb0ff); }   (soft tints, links, focus, charts and diagrams follow it)
   To force one scheme instead of following the system: scheme: dark (or light) in the page's frontmatter, which pack writes as
   <html data-scheme="dark">; charts and diagrams follow it too.
   Colour what the reader compares, each compared thing (a phase, an option, a series) in the same --c1..--c6 on every chart and
   view; var(--muted) is for context a section is not about (the rest of a total, a baseline). The accent marks the headline phrase
   (h1 em) and the mark a readout points at.
   Classes: page masthead lede meta label cols wide band beside minor | fig panel fig-visual stage bleed split chart mermaid scroll dg |
   controls seg toggle field player btn reset | stats chip legend caveat detail details tabs | rank compare num mark expand |
   view view-head back | tree tree-head (hierarchical records as nested <details>, number columns sized by --tree-cols under an
   optional head: kit Tree renders it) | toolbar (the row over a records section: a .seg view switch, <input
   type="search">, selects or .field filters, each named by a caption or aria-label; one compact row, two even columns on phones;
   Expand all joins its end. Layout only: the page owns their state, and inputs with ids are kept across reloads: kit keep).
   Category markers: <span class="chip" style="--swatch: var(--c2)"><i></i>Firmware</span> is a square in the category's colour
   before its word. A <p class="legend"> of them over the records keys each category once, and rows repeat the marker with its word
   or a short form of it ("FW"): colour alone does not tell the categories apart for every reader.
   Figures: a .fig sits plain on the page; one with an input, select, tabs or stepper inside (or .panel) is a panel, whose children
   are inset; .bleed .stage .chart .scroll .compare .mermaid .dg run edge to edge, .split is an edge-to-edge row of columns divided by
   hairlines, .stats and .rank sit inset with no extra rules. .wide lets a .fig use up to 88rem on big screens, centred on the
   column, beside the contents rail too.
   The inset is a default (padding-inline: var(--pad) on every direct child of .fig): any padding the page puts on such a child
   replaces it, so write padding: 1rem var(--pad) (or padding-block alone) to keep it.
   Rhythm: .band (once, where the reader acts) spans the window in the sunken tone; .beside sets text next to its figure; .minor
   sections (method, sources) are set smaller with the heading in its own column.
   Tables: .compare is a table on wide screens. On phones each row becomes a block: its <th scope="row"> on top, then a line per
   <td data-label="...">, its label (the column's header, repeated) beside its value; a td without data-label shows its value alone.
   class="num" on a numeric column's th and tds aligns it to the end, digits lined up. tr data-state="fit", "maybe" or "out"
   gives a row an ok or info edge, or mutes it. .compare.table inside .scroll stays a table on phones and scrolls sideways:
     <table class="compare"><thead><tr><th>Store</th><th class="num">Latency</th></tr></thead>
       <tbody><tr><th scope="row">Redis</th><td class="num" data-label="Latency">2 ms</td></tr></tbody></table>
   Tokens: --bg --surface --sunken --ink --muted --rule --rule-strong --accent --accent-soft --ok --bad --warn --info --c1..--c6 --font --mono;
   --under is the tone under the current block (page, panel, band or .stage): give a label halo of your own stroke: var(--under).
   Fonts: Geist and Geist Mono (SIL OFL 1.1, Vercel), latin subsets, about 70 KB inlined; licence in licenses/OFL.txt.
   Mono is for code, numbers and source lines, not for labels.
   Page CSS wins over the kit (pack puts the kit in @layer kit); pack warns when a page rule styles a class the kit styles itself.
   Files: the rules live by concern in parts/theme/*.css (base and tokens, layout, graphics, controls, data, notes and views, navigation, trees); pack
   puts them in name order before this file, which ends the cascade with the stepper, highlighting and reply rules. */

/* features: stepper (kit:steps.js), linked highlighting (kit:link.js), replies (kit:reply.js). Tokens only.
   Scripts toggle the classes is-on, is-now, is-linked, is-lit, has-lit, is-annotatable and is-armed; page markup carries data-stepper, data-step, data-captions, data-ref, data-reply. */
/* Stepper: a part ghosts until its first step and is lit on the steps that list it. Gated on [data-live], which the script sets, so without JS the page is the full picture. */
[data-live] [data-step] {
	transition: opacity 0.3s var(--ease);
}
[data-live] [data-step]:not(.is-on) {
	opacity: 0.15;
}
[data-captions] {
	margin: 0;
	padding-block: 0.75rem;
	padding-inline: calc(var(--pad, var(--inset)) + 1.5rem) var(--pad, var(--inset));
}
[data-live] [data-captions] {
	list-style: none;
	padding-inline: var(--pad, var(--inset));
}
[data-live] [data-captions] > li {
	max-inline-size: 66ch;
	padding-inline-start: 0.75rem;
	border-inline-start: 3px solid var(--accent);
}
[data-live] [data-captions] > li:not(.is-now) {
	display: none;
}

/* Linked highlighting: parts that share a data-ref are lit together; SVG parts get a halo and dimmed neighbours, which work over any stroke and fill.
   Only a term that links (is-linked, set by kit:link.js) looks like one. */
:is(span, b, strong, em, code, mark).is-linked {
	text-decoration: underline dotted var(--muted) 1px;
	text-underline-offset: 0.22em;
	border-radius: 0.25rem;
	cursor: pointer;
}
:is(.is-lit, [data-step].is-now):not(svg *) {
	background: var(--accent-soft);
}
svg :is(.is-lit, .is-now) {
	filter: drop-shadow(0 0 0.25rem var(--accent));
}
svg.has-lit [data-ref]:not(.is-lit) {
	opacity: 0.3;
}

/* Replies: the Reply and Clear answers buttons, the Note button and editor, and the reply dialog. */
/* The Reply and Clear buttons sit in an opaque strip across the top of the window. A page with reply.js keeps the strip's height
   free at its top, also while the strip is hidden: at the top of the page nothing is under it, and showing or hiding it never
   moves the page. Scrolled, content passes under the whole strip, as under the window's edge, never beside a button.
   --reply-bar-height is the strip's last shown height, which reply.js sets: long kitLabels can wrap it onto two rows. */
:root:has(> body > .reply-bar) {
	--reply-bar: 3.5rem;
}
body:has(> .reply-bar) {
	padding-block-start: var(--reply-bar-height, var(--reply-bar));
}
/* Focus and in-page links scroll their target clear of the strip. */
:root:has(> body > .reply-bar:not([hidden])) {
	scroll-padding-block-start: var(--reply-bar-height, var(--reply-bar));
}
/* A term that takes a note (is-annotatable, set by reply.js) and links nothing: a fainter underline than a link's and the menu
   cursor, since a click offers a note rather than lighting anything. */
:is(span, b, strong, em, code, mark).is-annotatable:not(.is-linked) {
	text-decoration: underline dotted var(--rule-strong) 1px;
	text-underline-offset: 0.22em;
	cursor: context-menu;
}
.reply-bar {
	position: fixed;
	inset: 0 0 auto;
	z-index: 20;
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	justify-content: flex-end;
	gap: 0.5rem;
	min-block-size: var(--reply-bar);
	padding: 0.5rem var(--gutter);
	background: var(--bg);
	border-block-end: 1px solid var(--rule);
}
.reply-hint {
	box-shadow: 0 10px 24px -10px var(--lift);
}
.reply-bar .btn.is-armed {
	color: var(--bg);
	background: var(--bad);
	border-color: var(--bad);
}
.reply-hint,
.reply-pop {
	position: absolute;
	z-index: 30;
}
.reply-pop {
	display: grid;
	gap: 0.5rem;
	inline-size: min(22rem, 100vw - 1rem);
	padding: 0.75rem;
	background: var(--surface);
	border: 1px solid var(--rule-strong);
	border-radius: var(--radius);
	box-shadow: 0 16px 36px -14px var(--lift);
}
.reply-pop > p,
.reply-dialog p {
	margin: 0;
}
.reply-row {
	display: flex;
	gap: 0.5rem;
	justify-content: flex-end;
}
.reply-pop textarea,
.reply-note textarea {
	inline-size: 100%;
	min-block-size: 5rem;
	padding: 0.5rem 0.625rem;
	resize: vertical;
	font: inherit;
	color: var(--ink);
	background: var(--bg);
	border: 1px solid var(--rule-strong);
	border-radius: 0.375rem;
}
dialog.reply-dialog {
	inline-size: min(44rem, 100vw - 2rem);
	max-block-size: 88vh;
	padding: 0;
	color: var(--ink);
	background: var(--surface);
	border: 1px solid var(--rule-strong);
	border-radius: var(--radius);
	box-shadow: 0 28px 64px -20px var(--lift);
}
dialog.reply-dialog::backdrop {
	background: color-mix(in srgb, var(--ink) 40%, transparent);
}
dialog.reply-dialog[open] {
	display: grid;
	grid-template-rows: auto minmax(0, 1fr) auto;
	overflow: hidden;
}
.reply-dialog > :is(header, footer) {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 0.75rem;
	margin: 0;
	padding: 0.75rem 1rem;
}
.reply-dialog > header {
	border-block-end: 1px solid var(--rule);
}
.reply-body {
	overflow: auto;
}
.reply-body > * {
	margin: 0;
	padding: 0.75rem 1rem;
}
.reply-dialog h2 {
	margin: 0;
	max-inline-size: none;
	font-size: 1.125rem;
}
.reply-note {
	display: grid;
	justify-items: start;
	gap: 0.5rem;
	border-block-end: 1px solid var(--rule);
}
.reply-md {
	border-radius: 0;
	font-size: 0.8125rem;
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}
.reply-invisible {
	position: absolute;
	opacity: 0;
	pointer-events: none;
}
@media print {
	[data-live] [data-step] {
		opacity: 1;
	}
	[data-live] [data-captions] > li {
		display: list-item;
	}
	.reply-ui {
		/* biome-ignore lint/complexity/noImportantStyles: the reply controls never print, whatever display they set */
		display: none !important;
	}
	body:has(> .reply-bar) {
		padding-block-start: 0;
	}
}
/* end features */

.table-box {

   saved value is dropped when the control's own label or type differs from when it was saved (a regenerated page).

(() => {
  const selector = "input:not([type=button], [type=submit], [type=reset], [type=hidden], [type=file], [type=password], [type=image]), select, textarea";
  const clean = (s) => s.replace(/\s+/g, " ").trim();
  const ownText = (label) => {
    const copy = document.createElement("div");
    copy.innerHTML = label.innerHTML;
    for (const n of copy.querySelectorAll("input, select, textarea, output")) {
      n.remove();
    }
    return clean(copy.textContent ?? "");
  };
  let storedNotes = [];
  let notes = {
    list: () => Array.isArray(storedNotes) ? storedNotes : [],
    restore: (saved) => {
      storedNotes = saved;
    }
  };
  let onChange = () => void update();
  const SELF_CHECK = "fieldset.self-check";
  const isRadio = (c) => c.type === "radio";
  const isToggle = (c) => isRadio(c) || c.type === "checkbox";
  const isMultiSelect = (c) => c instanceof HTMLSelectElement && c.multiple;
  const signature = (c) => clean(`${c.type}|${c.getAttribute("aria-label") || c.labels?.[0] && ownText(c.labels[0]) || c.closest(".field")?.firstElementChild?.textContent || c.name || "placeholder" in c && c.placeholder || ""}`);
  const storeKey = `explainer:${location.href.split(/[?#]/)[0]}`;
  let touched = new WeakSet;
  const defaults = new Map;
  let pending = {};
  const taken = new Map;
  const MAX_TRIES = 3;
  let applying = false;
  let ready = false;
  const groupOf = (c) => `${c.form ? [...document.forms].indexOf(c.form) : -1}:${c.name}`;
  function unitKey(c, index) {
    if (c.id) {
      return `#${c.id}`;
    }
    return c.type === "radio" && c.name ? `radio:${groupOf(c)}=${c.value}` : `${c.type}@${index}`;
  }
  function initialValue(c) {
    const box = document.createElement("div");
    box.innerHTML = c.outerHTML;
    return readControl(box.querySelector(selector) ?? c);
  }
  function readControl(c) {
    if (isToggle(c)) {
      return c.checked;
    }
    return isMultiSelect(c) ? [...c.selectedOptions].map((o) => o.value) : c.value;
  }
  function writeControl(c, value) {
    if (isToggle(c)) {
      c.checked = value === true;
    } else if (isMultiSelect(c) && Array.isArray(value)) {
      for (const o of c.options) {
        o.selected = value.includes(o.value);
      }
    } else {
      c.value = String(value);
    }
  }
  const kind = (value) => Object.prototype.toString.call(value);
  const fits = (unit, value) => kind(value) === kind(unit.initial);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  function units() {
    const controls = [...document.querySelectorAll(selector)].filter((c) => !c.closest(".reply-ui, [data-keep=off]"));
    return controls.map((el, i) => {
      const key = unitKey(el, i);
      const sig = signature(el);
      let entry = defaults.get(key);
      if (entry?.sig !== sig) {
        entry = { initial: initialValue(el), sig };
        defaults.set(key, entry);
      }
      return { el, key, ...entry };
    });
  }
  const moved = (u) => !same(readControl(u.el), u.initial);
  const answered = (u) => moved(u) || touched.has(u.el);
  function announce(c) {
    for (const type of ["input", "change"]) {
      c.dispatchEvent(new Event(type, { bubbles: true }));
    }
  }
  const groupChosen = (c) => Boolean(c.name) && [...document.getElementsByName(c.name)].some((r) => r instanceof HTMLInputElement && r.type === "radio" && r.form === c.form && r.checked);
  function speakers(writes) {
    const spoken = new Map;
    for (const { el } of writes) {
      if (!isRadio(el) || el.checked) {
        spoken.set(el, el);
      } else if (!groupChosen(el)) {
        spoken.set(el.name ? groupOf(el) : el, el);
      }
    }
    return [...spoken.values()];
  }
  function apply(writes) {
    applying = true;
    try {
      for (const { el, value } of writes) {
        writeControl(el, value);
        touched.add(el);
      }
      for (const el of speakers(writes)) {
        announce(el);
      }
    } finally {
      applying = false;
    }
  }
  function settle() {
    for (const [key, { el }] of taken) {
      if (el.isConnected) {
        taken.delete(key);
        delete pending[key];
      }
    }
  }
  function adopt() {
    settle();
    const writes = [];
    for (const u of units()) {
      const entry = pending[u.key];
      if (!entry) {
        continue;
      }
      const tries = taken.get(u.key)?.tries ?? 0;
      if (tries && moved(u)) {
        taken.set(u.key, { el: u.el, tries });
      } else if (entry.sig === u.sig && fits(u, entry.value) && tries < MAX_TRIES) {
        writes.push({ el: u.el, value: entry.value });
        taken.set(u.key, { el: u.el, tries: tries + 1 });
      } else {
        delete pending[u.key];
        taken.delete(u.key);
      }
    }
    apply(writes);
  }
  let keptById = {};
  function snapshot() {
    const present = units();
    const here = new Set(present.map((u) => u.key));
    for (const [key, entry] of Object.entries(keptById)) {
      if (!(here.has(key) || (key in pending))) {
        pending[key] = entry;
      }
    }
    const controls = { ...pending };
    for (const u of present.filter(answered)) {
      const check = u.el.closest(SELF_CHECK) ? { check: true } : {};
      controls[u.key] = { value: readControl(u.el), sig: u.sig, ...check };
    }
    keptById = Object.fromEntries(Object.entries(controls).filter(([key]) => key.startsWith("#")));
    return { controls, notes: notes.list() };
  }
  const empty = (state) => !state.notes.length && !Object.keys(state.controls).length;
  function persist(state) {
    try {
      if (empty(state)) {
        localStorage.removeItem(storeKey);
      } else {
        localStorage.setItem(storeKey, JSON.stringify(state));
      }
    } catch {}
  }
  function stored() {
    try {
      return JSON.parse(localStorage.getItem(storeKey) ?? "{}") ?? {};
    } catch {
      return {};
    }
  }
  function restore() {
    const state = stored();
    const saved = state.controls;
    pending = saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
    notes.restore(state.notes);
    ready = true;
    onChange();
  }
  function clear() {
    apply(units().filter(moved).map((u) => ({ el: u.el, value: u.initial })));
    touched = new WeakSet;
    pending = {};
    keptById = {};
    taken.clear();
    onChange();
  }
  function update() {
    if (!ready) {
      return notes.list().length > 0;
    }
    if (!applying) {
      adopt();
    }
    const state = snapshot();
    persist(state);
    return state.notes.length > 0 || Object.values(state.controls).some((entry) => entry.check !== true);
  }
  const later = () => setTimeout(() => onChange());
  for (const type of ["input", "change", "click"]) {
    document.addEventListener(type, later);
  }
  addEventListener("pagehide", () => onChange());
  const isControl = (n) => n instanceof Element && (n.matches(selector) || n.querySelector(selector));
  new MutationObserver((records) => {
    if (records.some((m) => !(m.target instanceof Element && m.target.closest(".reply-ui")) && [...m.addedNodes, ...m.removedNodes].some(isControl))) {
      later();
    }
  }).observe(document.body, { childList: true, subtree: true });
  if (document.readyState === "complete") {
    setTimeout(restore);
  } else {
    addEventListener("load", () => setTimeout(restore), { once: true });
  }
  window.Keep = {
    selector,
    ownText,
    update,
    clear,
    touch: (el) => touched.add(el),
    touched: (el) => touched.has(el),
    attach(owner) {
      owner.notes.restore(notes.list());
      ({ notes, onChange } = owner);
      onChange();
    }
  };
})();
</script>
</body>
</html>
